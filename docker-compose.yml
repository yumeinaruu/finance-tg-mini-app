services:
  finance:
    build: .
    image: finance-bot:latest
    container_name: finance-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    mem_limit: 280m
    memswap_limit: 400m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 1m
      timeout: 5s
      retries: 3
